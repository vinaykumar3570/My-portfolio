  <style>
    .hero h1 {
      font-size: 40px;
      font-family: "Orbitron", sans-serif;
    }

    .hero h1 span {
      color: var(--primary);
      font-family: "Orbitron", sans-serif;
    }

    .hero h2 {
      text-align: center;
      font-size: 30px;
      font-family: "Orbitron", sans-serif;
    }

    .hero h2 span.typed-text {
      font-weight: bold;
      color: #e0e0e0;
    }

    .hero h2 span.cursor {
      display: inline-block;
      background-color: #ccc;
      margin-left: .2rem;
      width: 3px;
      animation: blink 1s infinite;
    }

    .hero h2 span.cursor.typing {
      animation: none;
    }

    @keyframes blink {
      0% {
        background-color: #ccc;
      }

      49% {
        background-color: #ccc;
      }

      50% {
        background-color: transparent;
      }

      99% {
        background-color: transparent;
      }

      100% {
        background-color: #ccc;
      }
    }

    .sunshine {
      position: fixed;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      opacity: .1;
      /* z-index: -1 */
    }

    .btn-primary:active{
      background: var(--secondary) !important;
    }
  </style>



</head>
