<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Projects | Vinay Kumar</title>

  <!-- Favicon Icon link -->
  <link rel="shortcut icon" href="images/icons/favicon/work.png" type="image/x-icon">

  <!-- Bootstrap CDN  -->
  <link rel="stylesheet" href="bootstrap/Bootstrap.css" />
  <script src="Bootstrap/Bootstrap_js_bundle.js"></script>

  <!--=============== REMIXICONS ===============-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" />

  <!-- External CSS Link  -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="stylesheet" href="css/work.css">

  <style>

  </style>

</head>

<body>
  <span id="cursor"></span>
  <span class="circle circle1"></span>
  <span class="circle circle2"></span>
  <header class="header">
    <div class="container-lg d-flex justify-content-center">
      <nav class="nav">
        <a href="index.html" class="nav__logo">
          <i class="ri-vk-line"></i>
        </a>
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li><a href="index.html" class="nav__link"> Home </a></li>
            <li><a href="about.html" class="nav__link"> About </a></li>
            <li><a href="work.html" class="nav__link active"> Work </a></li>
            <li><a href="about.html#contact" class="nav__link"> Contact </a></li>
          </ul>
        </div>
        <div class="nav__buttons">
          <a href="images/resume.pdf" target="_blank">
            <button class="nav__hire">View Resume </button>
          </a>
          <button class="nav__toggle" id="nav-toggle">
            <i class="ri-menu-line nav__burger"></i>
            <i class="ri-close-line nav__close"></i>
          </button>

        </div>
      </nav>
    </div>
  </header>


  <section class="container">
    <section class="work-section" id="work">
      <div class="container">
        <div class="text-center">
          <!-- <div class="eyebrow mb-2">A selection of things I've made</div> -->
          <h2 class="mb-3">My <span>Work</span></h2>
          <p> A mix of frontend experiences and visual design — built to work beautifully and make an impression.</p>
        </div>

        <div class="filter-bar" role="group" aria-label="Filter projects">
          <button class="filter-btn active" type="button" data-filter="all"> All Work 
            <span class="ms-1" id="count-all"></span>
          </button>
          <button class="filter-btn" type="button" data-filter="frontend">Frontend</button>
          <button class="filter-btn" type="button" data-filter="graphic">Graphic Design</button>
          <!-- <button class="filter-btn" type="button" data-filter="branding">Branding</button> -->
          <!-- <button class="filter-btn" type="button" data-filter="video">Video</button> -->
        </div>

        <div class="row g-4" id="projectGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState">No projects in this category yet.</div>
      </div>
    </section>

    <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <div class="eyebrow mb-1">Project preview</div>
              <div class="small text-white-50">Explore the work</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-4 align-items-start">
              <div class="col-lg-7">
                <div class="modal-preview">
                  <img class="modal-main-image" id="modalImage" src="" alt="">
                  <div class="gallery-strip" id="galleryStrip" hidden></div>
                </div>
              </div>
              <div class="col-lg-5">
                <span class="modal-category" id="modalCategory"></span>
                <h2 class="modal-project-title mb-3" id="modalTitle"></h2>
                <p class="modal-description mb-3" id="modalDescription"></p>
                <div class="tech-list" id="modalTags"></div>
                <div class="modal-actions" id="modalActions"></div>
                <div class="modal-meta" id="modalMeta"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/work.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
